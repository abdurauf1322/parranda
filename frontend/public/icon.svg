<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with squircle safe-zone padding -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Golden Egg / Farm Icon -->
  <g transform="translate(136, 100)" filter="url(#glow)">
    <!-- Egg Silhouette -->
    <path d="M 120 20 C 60 20, 20 120, 20 200 C 20 270, 65 310, 120 310 C 175 310, 220 270, 220 200 C 220 120, 180 20, 120 20 Z" fill="url(#gold)"/>
    <!-- Rooster Crest Silhouette -->
    <path d="M 120 50 C 105 25, 95 10, 85 30 C 75 15, 60 15, 55 35 C 45 25, 30 35, 40 60 Z" fill="#ef4444"/>
    <!-- Eye -->
    <circle cx="85" cy="80" r="8" fill="#0f172a"/>
    <!-- Beak -->
    <polygon points="50,90 25,100 50,110" fill="#f97316"/>
  </g>

  <!-- Title Text -->
  <text x="256" y="445" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    UYCHI PARRANDA
  </text>
  <text x="256" y="480" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="4">
    BOSHQARUV TIZIMI
  </text>
</svg>
